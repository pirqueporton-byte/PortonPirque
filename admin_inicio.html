<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Smart Hub - Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F5F7FA; --surface: #FFFFFF; --border: #E4E7EB; --text-main: #111827; --text-muted: #6B7280; --primary: #0F172A; --shadow: 0 10px 30px -10px rgba(0,0,0,0.1); --cyan-glow: #00D4FF; }
  [data-theme="dark"] { --bg: #121418; --surface: #1E2128; --border: #2C303A; --text-main: #F3F4F6; --text-muted: #9CA3AF; --primary: #F8FAFC; --shadow: 0 10px 30px -10px rgba(0,0,0,0.6); --cyan-glow: #A0E0FF; }
  * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; text-decoration: none; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text-main); display: flex; transition: 0.3s; overflow: hidden; }

  /* SIDEBAR MINIMALISTA */
  .dash-sidebar { width: 80px; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding-top: 24px; z-index: 50; border-right: 1px solid var(--border); }
  .dash-logo-icon { width: 44px; height: 44px; background: var(--surface); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--text-main); margin-bottom: 30px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .dash-nav-item { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border-radius: 12px; color: var(--text-muted); cursor: pointer; margin-bottom: 12px; transition: 0.2s; border: 1px solid transparent; }
  .dash-nav-item.active { background: var(--surface); color: var(--text-main); box-shadow: var(--shadow); border: 1px solid var(--border); }
  .dash-nav-item:hover:not(.active) { color: var(--text-main); }
  .dash-nav-item svg { width: 20px; height: 20px; }

  /* CONTENIDO */
  .dash-content { flex: 1; padding: 32px 40px; overflow-y: auto; }
  .dash-title { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.5px; }
  .dash-subtitle { font-size: 14px; color: var(--text-muted); margin: 0 0 32px; }
  
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; }
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); cursor: pointer; transition: 0.2s; }
  .dash-card:hover { transform: translateY(-3px); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: 600; font-size: 15px; }
  .dash-value { font-size: 28px; font-weight: 700; margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .dash-sub-value { font-size: 13px; font-weight: 500; color: var(--text-muted); }

  @media (max-width: 850px) {
    body { flex-direction: column; }
    .dash-sidebar { width: 100%; height: 70px; flex-direction: row; order: 2; border-right: none; border-top: 1px solid var(--border); justify-content: space-around; padding: 0; }
    .dash-logo-icon { display: none; }
    .dash-nav-item { margin: 0; width: 44px; height: 44px; }
    .dash-content { padding: 20px; order: 1; }
  }
</style>
</head>
<body data-theme="dark">

<aside class="dash-sidebar">
  <div class="dash-logo-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
  <a href="admin_inicio.html" class="dash-nav-item active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg></a>
  <a href="admin_porton.html" class="dash-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg></a>
  <a href="admin_riego.html" class="dash-nav-item"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></a>
  <a href="#" onclick="cerrarSesion()" class="dash-nav-item" style="color:#D93025;"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></a>
</aside>

<main class="dash-content">
  <h1 class="dash-title">Bienvenido, Administrador</h1>
  <p class="dash-subtitle">Resumen del estado de tu hogar inteligente.</p>
  
  <div class="dash-grid">
    <div class="dash-card" onclick="window.location.href='admin_porton.html'">
      <div class="card-header">Portón <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16h12V4a2 2 0 0 0-2-2z"></path><path d="M14 10h-2"></path></svg></div>
      <div class="dash-value conexion-text" style="color:var(--text-muted); font-size: 18px;">Verificando...</div>
    </div>
    
    <div class="dash-card" onclick="window.location.href='admin_riego.html'">
      <div class="card-header">Riego Activo <svg fill="none" stroke="var(--cyan-glow)" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
      <div class="dash-value">0 <span class="dash-sub-value">zonas regando</span></div>
    </div>

    <div class="dash-card">
      <div class="card-header">Estanque <svg fill="none" stroke="#06B6D4" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg></div>
      <div class="dash-value">76%</div>
      <div style="width:100%; height:6px; background:var(--border); border-radius:3px; margin-top:12px; overflow:hidden;"><div style="width:76%; height:100%; background:#06B6D4;"></div></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
if (localStorage.getItem('riegoTheme') === 'light') document.body.removeAttribute('data-theme');

const firebaseConfig = { apiKey: "AIzaSyCABy9Rpn1wc1gYBzDEm8Mf05x0gu9lpyQ", authDomain: "portonpirque.firebaseapp.com", databaseURL: "https://portonpique-default-rtdb.firebaseio.com/", projectId: "portonpirque" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.database(); const ADMIN_EMAIL = "pirqueporton@gmail.com";

auth.onAuthStateChanged((user) => {
    if(!user || user.email !== ADMIN_EMAIL) window.location.href = 'index.html';
    else {
      let ultimoLatido = 0; let serverTimeOffset = 0;
      db.ref('.info/serverTimeOffset').on('value', snap => serverTimeOffset = snap.val() || 0);
      db.ref('estado_porton/ultima_conexion').on('value', snap => { if(snap.exists()) ultimoLatido = snap.val(); });
      setInterval(() => {
        const dif = ((Date.now() + serverTimeOffset) - ultimoLatido) / 1000;
        document.querySelector('.conexion-text').textContent = dif > 30 ? 'Fuera de línea' : 'En línea';
        document.querySelector('.conexion-text').style.color = dif > 30 ? '#D93025' : '#1E8E3E';
      }, 1000);
    }
});
function cerrarSesion() { auth.signOut().then(() => window.location.href = 'index.html'); }
</script>
</body>
</html>
