<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Portón Pirque</title>
<meta name="theme-color" content="#F8F9FA">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --dash-bg: #F8F9FA; --dash-sidebar: #FFFFFF; --dash-active-bg: #E8F0FE;
    --dash-active-text: #1967D2; --dash-border: #E8EAED; --text-main: #202124;
    --text-muted: #5F6368; --card-bg: #FFFFFF; --primary: #1967D2;
    --danger: #D93025; --success: #1E8E3E; --cyan-riego: #00FFFF;
  }

  [data-theme="dark"] {
    --dash-bg: #121212; --dash-sidebar: #1E1E1E; --dash-active-bg: #2C3E50;
    --dash-active-text: #6CB4EE; --dash-border: #333333; --text-main: #E8EAED;
    --text-muted: #9AA0A6; --card-bg: #1E1E1E;
  }

  * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { margin: 0; padding: 0; min-height: 100vh; background: var(--dash-bg); color: var(--text-main); overflow: hidden; }

  /* ==========================================================
     VISTA ADMINISTRADOR (ESTRUCTURA BASE)
     ========================================================== */
  #vista-dashboard { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
  .dash-sidebar { width: 250px; background: var(--dash-sidebar); border-right: 1px solid var(--dash-border); display: flex; flex-direction: column; z-index: 10; flex-shrink: 0; }
  .dash-logo { padding: 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--dash-border); margin-bottom: 12px; }
  .dash-logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; }
  
  .dash-nav { flex: 1; padding: 0 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .dash-nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: none; background: transparent; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-align: left; transition: 0.2s; }
  .dash-nav-item svg { width: 20px; height: 20px; }
  .dash-nav-item.active { background: var(--dash-active-bg); color: var(--dash-active-text); }
  .dash-footer { padding: 12px; border-top: 1px solid var(--dash-border); }
  
  .dash-content { flex: 1; overflow-y: auto; padding: 30px; background: var(--dash-bg); display: flex; flex-direction: column; }
  .dash-tab-content { display: none; width: 100%; height: 100%; animation: fadeIn 0.3s ease; flex-direction: column; }
  .dash-tab-content.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .dash-title { font-size: 26px; font-weight: 700; margin: 0 0 6px; color: var(--text-main); }
  .dash-subtitle { font-size: 14px; color: var(--text-muted); margin: 0; }

  /* ==========================================================
     MÓDULO DE RIEGO (MAPA Y SETTINGS)
     ========================================================== */
  .riego-header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-shrink: 0; }
  .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
  .btn-outline { background: transparent; border: 1px solid var(--dash-border); padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-main); }
  
  .riego-layout { display: flex; gap: 24px; flex: 1; min-height: 0; }
  
  /* Contenedor del Mapa */
  .riego-map-wrapper { flex: 2; background: #000; border-radius: 16px; position: relative; overflow: hidden; border: 1px solid var(--dash-border); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  
  .map-toolbar { position: absolute; bottom: 20px; left: 20px; z-index: 20; display: flex; gap: 10px; background: rgba(30,30,30,0.8); padding: 8px; border-radius: 10px; backdrop-filter: blur(4px); }
  .map-tool-btn { background: transparent; border: none; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .map-tool-btn.active { background: rgba(255,255,255,0.2); }
  
  .zoom-controls { position: absolute; right: 20px; bottom: 20px; z-index: 20; display: flex; flex-direction: column; gap: 5px; }
  .zoom-btn { width: 36px; height: 36px; background: rgba(30,30,30,0.8); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }

  /* El Transformador del mapa (Paneo y Zoom) */
  #map-transform { position: absolute; transform-origin: 0 0; transition: transform 0.1s linear; cursor: grab; }
  #map-transform.drawing { cursor: crosshair; }
  #map-image { display: block; opacity: 0.8; pointer-events: none; }
  
  /* Capa SVG para dibujos */
  #map-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .svg-interactive { pointer-events: auto; }
  .zone-poly { fill: rgba(0, 255, 255, 0.25); stroke: var(--cyan-riego); stroke-width: 2px; cursor: pointer; transition: 0.2s; }
  .zone-poly:hover { fill: rgba(0, 255, 255, 0.4); }
  .zone-poly.selected { stroke-width: 4px; stroke: #fff; filter: drop-shadow(0 0 8px var(--cyan-riego)); }
  .draw-line { stroke: var(--cyan-riego); stroke-width: 2px; stroke-dasharray: 4; }
  .draw-point { fill: #fff; stroke: var(--cyan-riego); stroke-width: 2px; cursor: pointer; }
  .snap-point { fill: #FFEB3B; r: 6; }

  /* Panel Derecho de Ajustes */
  .riego-settings { flex: 1; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--dash-border); padding: 24px; display: flex; flex-direction: column; overflow-y: auto; max-width: 380px; }
  .settings-empty { text-align: center; color: var(--text-muted); margin: auto 0; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .settings-empty svg { width: 48px; height: 48px; opacity: 0.3; }
  
  .settings-form { display: none; flex-direction: column; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group label { font-size: 13px; font-weight: 600; color: var(--text-main); }
  .form-input { padding: 10px 12px; border: 1px solid var(--dash-border); border-radius: 8px; background: transparent; color: var(--text-main); font-size: 14px; }
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-btn { padding: 8px 0; text-align: center; border: 1px solid var(--dash-border); background: transparent; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
  
  .btn-run { background: #1A73E8; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
  .btn-run:hover { background: #1557B0; }
  .btn-run svg { width: 20px; height: 20px; }
</style>
</head>
<body data-theme="dark">

<div id="vista-dashboard">
  <!-- SIDEBAR -->
  <aside class="dash-sidebar">
    <div class="dash-logo">
      <div class="dash-logo-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div>
      <div><div style="font-weight:700; color:var(--text-main);">Smart Hub</div><div style="font-size:12px; color:var(--text-muted);">Admin</div></div>
    </div>
    <nav class="dash-nav">
      <button class="dash-nav-item" onclick="alert('Módulo en construcción')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg> Inicio</button>
      <button class="dash-nav-item active" id="nav-riego"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Riego</button>
    </nav>
  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="dash-content">
    
    <!-- PESTAÑA RIEGO -->
    <div id="tab-riego" class="dash-tab-content active">
      
      <div class="riego-header-bar">
        <div>
          <h1 class="dash-title">Control de Riego</h1>
          <p class="dash-subtitle">Haz clic en una zona para configurarla o crea nuevos sectores.</p>
        </div>
        <button class="btn-primary" onclick="document.getElementById('map-upload').click()">Subir Nuevo Mapa</button>
        <input type="file" id="map-upload" hidden accept="image/*" onchange="cargarMapa(event)">
      </div>

      <div class="riego-layout">
        
        <!-- VISOR DEL MAPA -->
        <div class="riego-map-wrapper" id="map-wrapper">
          
          <div class="map-toolbar">
            <button class="map-tool-btn active" id="btn-mode-pan" onclick="setMode('pan')">🖐 Ajustar</button>
            <button class="map-tool-btn" id="btn-mode-perimeter" onclick="setMode('perimeter')">📐 Perímetro</button>
            <button class="map-tool-btn" id="btn-mode-zone" onclick="setMode('zone')">+ Nueva Zona</button>
          </div>

          <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomMap(0.2)">+</button>
            <button class="zoom-btn" onclick="zoomMap(-0.2)">-</button>
          </div>

          <div id="map-transform">
            <img id="map-image" src="" style="display:none;" onload="iniciarMapa(this)">
            <svg id="map-svg" class="svg-interactive"></svg>
          </div>

        </div>

        <!-- PANEL DE AJUSTES (DERECHA) -->
        <div class="riego-settings">
          
          <div class="settings-empty" id="settings-empty">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.688-.06-1.386-.09-2.09-.09H7.5a4.5 4.5 0 110-9h.71C9.72 4.53 10.81 3 12.5 3c1.95 0 3.09 1.81 3.44 3.75a4.5 4.5 0 011.56 8.9v.1"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 11v8m0 0l-3-3m3 3l3-3"></path></svg>
            Selecciona una zona en el mapa para ver su configuración o crear una nueva.
          </div>

          <div class="settings-form" id="settings-form">
            <h2 id="zone-title" style="margin:0 0 20px; font-size:20px;">Nombre de Zona</h2>
            
            <div class="form-group">
              <label>Días de riego</label>
              <div class="days-grid">
                <button class="day-btn">L</button><button class="day-btn">M</button><button class="day-btn">M</button>
                <button class="day-btn">J</button><button class="day-btn">V</button><button class="day-btn">S</button><button class="day-btn">D</button>
              </div>
            </div>

            <div class="form-group">
              <label>Hora de inicio</label>
              <input type="time" class="form-input" value="06:00">
            </div>

            <div class="form-group">
              <label>Duración (minutos)</label>
              <input type="number" class="form-input" value="15">
            </div>

            <button class="btn-outline" style="margin-top:10px" onclick="guardarConfig()">Guardar Programación</button>
            <hr style="border:0; border-top:1px solid var(--dash-border); width:100%; margin:10px 0;">
            
            <div class="form-group">
              <label>Riego Directo Temporal</label>
              <div style="display:flex; gap:10px;">
                <input type="number" id="manual-time" class="form-input" value="5" style="width:80px">
                <span style="align-self:center; color:var(--text-muted); font-size:13px;">minutos</span>
              </div>
            </div>
            <button class="btn-run" onclick="ejecutarRiego()"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Regar Ahora</button>
            
            <button class="btn-outline" style="color:var(--danger); border-color:var(--danger); margin-top:20px;" onclick="eliminarZonaActual()">Eliminar Zona</button>
          </div>

        </div>

      </div>
    </div>
  </main>
</div>

<script>
/* ==========================================================
   MOTOR GRÁFICO DE RIEGO (PAN, ZOOM, CLIP, DRAW)
   ========================================================== */
const wrapper = document.getElementById('map-wrapper');
const transformEl = document.getElementById('map-transform');
const imgEl = document.getElementById('map-image');
const svgEl = document.getElementById('map-svg');

// Estado del mapa
let mapState = {
  mode: 'pan', // pan, perimeter, zone
  scale: 1, tx: 0, ty: 0,
  isDragging: false, startX: 0, startY: 0,
  imgWidth: 0, imgHeight: 0
};

// Datos de geometría
let perimeter = []; // [{x,y}, ...]
let zones = [];     // [{id, name, points:[{x,y}], ...}]
let currentDraw = [];
let selectedZoneId = null;

// Cargar imagen local
function cargarMapa(event) {
  const file = event.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      imgEl.src = e.target.result;
      imgEl.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

// Inicializar dimensiones
function iniciarMapa(img) {
  mapState.imgWidth = img.naturalWidth;
  mapState.imgHeight = img.naturalHeight;
  transformEl.style.width = mapState.imgWidth + 'px';
  transformEl.style.height = mapState.imgHeight + 'px';
  svgEl.setAttribute('viewBox', `0 0 ${mapState.imgWidth} ${mapState.imgHeight}`);
  
  // Auto-centrar y escalar
  const scaleX = wrapper.clientWidth / mapState.imgWidth;
  const scaleY = wrapper.clientHeight / mapState.imgHeight;
  mapState.scale = Math.min(scaleX, scaleY) * 0.9;
  mapState.tx = (wrapper.clientWidth - (mapState.imgWidth * mapState.scale)) / 2;
  mapState.ty = (wrapper.clientHeight - (mapState.imgHeight * mapState.scale)) / 2;
  
  perimeter = []; zones = []; currentDraw = [];
  actualizarTransform();
  renderSVG();
}

// Interfaz Botones
function setMode(mode) {
  mapState.mode = mode;
  document.querySelectorAll('.map-tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-mode-' + mode).classList.add('active');
  transformEl.className = (mode !== 'pan') ? 'drawing' : '';
  currentDraw = [];
  renderSVG();
}

// --- CONTROLES DE PANEO Y ZOOM ---
function actualizarTransform() {
  transformEl.style.transform = `translate(${mapState.tx}px, ${mapState.ty}px) scale(${mapState.scale})`;
}

function zoomMap(delta) {
  const oldScale = mapState.scale;
  mapState.scale = Math.max(0.1, Math.min(mapState.scale + delta, 5));
  // Ajustar tx/ty para hacer zoom al centro del contenedor
  const cx = wrapper.clientWidth / 2; const cy = wrapper.clientHeight / 2;
  mapState.tx = cx - (cx - mapState.tx) * (mapState.scale / oldScale);
  mapState.ty = cy - (cy - mapState.ty) * (mapState.scale / oldScale);
  actualizarTransform();
}

wrapper.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomMap(e.deltaY < 0 ? 0.1 : -0.1);
});

wrapper.addEventListener('mousedown', (e) => {
  if(e.button !== 0) return;
  if(mapState.mode === 'pan') {
    mapState.isDragging = true;
    mapState.startX = e.clientX - mapState.tx;
    mapState.startY = e.clientY - mapState.ty;
  }
});

window.addEventListener('mousemove', (e) => {
  if(mapState.isDragging && mapState.mode === 'pan') {
    mapState.tx = e.clientX - mapState.startX;
    mapState.ty = e.clientY - mapState.startY;
    actualizarTransform();
  }
});

window.addEventListener('mouseup', () => mapState.isDragging = false);

// --- DIBUJO Y LÓGICA DE SNAPPING (IMANTACIÓN) ---
function getSVGCoords(e) {
  const rect = transformEl.getBoundingClientRect();
  const x = (e.clientX - rect.left) / mapState.scale;
  const y = (e.clientY - rect.top) / mapState.scale;
  return {x, y};
}

// Encuentra el vértice más cercano de CUALQUIER polígono para evitar superposiciones
function buscarSnap(x, y) {
  const SNAP_DIST = 20 / mapState.scale; // 20px visuales de magnetismo
  let mejor = null; let minD = Infinity;

  const revisarPuntos = (pts) => {
    pts.forEach(p => {
      const d = Math.hypot(p.x - x, p.y - y);
      if(d < SNAP_DIST && d < minD) { minD = d; mejor = {...p}; }
    });
  };

  revisarPuntos(perimeter);
  zones.forEach(z => revisarPuntos(z.points));
  if(currentDraw.length > 0) revisarPuntos([currentDraw[0]]); // Snap al punto inicial para cerrar

  return mejor;
}

// MouseMove sobre el mapa para mostrar el punto imantado si estamos dibujando
wrapper.addEventListener('mousemove', (e) => {
  if(mapState.mode === 'pan' || currentDraw.length === 0) return;
  const c = getSVGCoords(e);
  const snap = buscarSnap(c.x, c.y);
  renderSVG(snap ? snap : c); // Dibuja la línea en tiempo real
});

wrapper.addEventListener('mousedown', (e) => {
  if(mapState.mode === 'pan' || e.button !== 0) return;
  
  const c = getSVGCoords(e);
  const snap = buscarSnap(c.x, c.y);
  const puntoFinal = snap ? snap : c;

  // Si tocamos el primer punto del dibujo actual, cerramos la figura
  if(currentDraw.length > 2 && snap && snap.x === currentDraw[0].x && snap.y === currentDraw[0].y) {
    if(mapState.mode === 'perimeter') {
      perimeter = [...currentDraw];
      setMode('pan');
    } else if (mapState.mode === 'zone') {
      const nombre = prompt("Nombre de la nueva zona:", "Zona " + (zones.length + 1));
      if(nombre) {
        zones.push({ id: Date.now().toString(), name: nombre, points: [...currentDraw] });
        seleccionarZona(zones[zones.length-1].id);
      }
      setMode('pan');
    }
  } else {
    currentDraw.push(puntoFinal);
    renderSVG();
  }
});

// --- RENDERIZADO SVG ---
function renderSVG(cursorCoord = null) {
  let html = '';

  // 1. Oscurecer el exterior del perímetro (Masking invertido con fill-rule="evenodd")
  if(perimeter.length > 2) {
    let d = `M 0 0 L ${mapState.imgWidth} 0 L ${mapState.imgWidth} ${mapState.imgHeight} L 0 ${mapState.imgHeight} Z `;
    d += `M ${perimeter[0].x} ${perimeter[0].y} `;
    for(let i=1; i<perimeter.length; i++) d += `L ${perimeter[i].x} ${perimeter[i].y} `;
    d += 'Z';
    html += `<path d="${d}" fill="rgba(0,0,0,0.65)" fill-rule="evenodd" />`;
    
    // Borde iluminado del perímetro
    const pts = perimeter.map(p => `${p.x},${p.y}`).join(' ');
    html += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="8" />`;
  }

  // 2. Dibujar Zonas creadas
  zones.forEach(z => {
    const pts = z.points.map(p => `${p.x},${p.y}`).join(' ');
    const isSelected = z.id === selectedZoneId;
    html += `<polygon class="zone-poly ${isSelected?'selected':''}" points="${pts}" onclick="seleccionarZona('${z.id}')" />`;
    
    // Icono gota de agua en el centroide
    let cx=0, cy=0;
    z.points.forEach(p=>{ cx+=p.x; cy+=p.y; });
    cx/=z.points.length; cy/=z.points.length;
    html += `<svg x="${cx-12}" y="${cy-12}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${isSelected?'#fff':'var(--cyan-riego)'}" stroke-width="2" pointer-events="none"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>`;
  });

  // 3. Dibujo en progreso
  if(currentDraw.length > 0) {
    let d = `M ${currentDraw[0].x} ${currentDraw[0].y} `;
    for(let i=1; i<currentDraw.length; i++) d += `L ${currentDraw[i].x} ${currentDraw[i].y} `;
    if(cursorCoord) d += `L ${cursorCoord.x} ${cursorCoord.y}`;
    html += `<path d="${d}" class="draw-line" fill="none" />`;
    
    currentDraw.forEach(p => { html += `<circle cx="${p.x}" cy="${p.y}" r="${4/mapState.scale}" class="draw-point" />`; });
    if(cursorCoord) html += `<circle cx="${cursorCoord.x}" cy="${cursorCoord.y}" r="${6/mapState.scale}" class="snap-point" />`;
  }

  svgEl.innerHTML = html;
}

// --- LÓGICA DEL PANEL DE SETTINGS ---
function seleccionarZona(id) {
  if(mapState.mode !== 'pan') return; // Bloquear selección si está dibujando
  selectedZoneId = id;
  renderSVG();
  
  const zona = zones.find(z => z.id === id);
  if(zona) {
    document.getElementById('settings-empty').style.display = 'none';
    document.getElementById('settings-form').style.display = 'flex';
    document.getElementById('zone-title').textContent = zona.name;
  }
}

function eliminarZonaActual() {
  if(confirm("¿Seguro que deseas eliminar esta zona?")) {
    zones = zones.filter(z => z.id !== selectedZoneId);
    selectedZoneId = null;
    document.getElementById('settings-empty').style.display = 'flex';
    document.getElementById('settings-form').style.display = 'none';
    renderSVG();
  }
}

function guardarConfig() { alert("Configuración guardada en la memoria."); }
function ejecutarRiego() {
  const min = document.getElementById('manual-time').value;
  alert(`Iniciando riego en válvula de ${document.getElementById('zone-title').textContent} por ${min} minutos...`);
}
</script>
</body>
</html>
